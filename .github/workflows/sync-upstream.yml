name: Sync upstream

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: Clarklevis1995/dsh-mobile
      SYNC_BRANCH: main
      OWN_WORKFLOW_DIR: .github/workflows
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          if git fetch upstream --prune --tags --force; then
            git rev-parse "upstream/${SYNC_BRANCH}" > "$RUNNER_TEMP/up_sha"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(cat "$RUNNER_TEMP/up_sha")" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::上游仓库无法访问，可能已删除或转为私有"
          fi

      - name: Sync upstream content, keep own workflows
        if: steps.fetch.outputs.ok == 'true'
        run: |
          set -euo pipefail
          UP_SHA="$(cat "$RUNNER_TEMP/up_sha")"
          CUR_SHA="$(git rev-parse "origin/${SYNC_BRANCH}")"
          echo "upstream = ${UP_SHA}"
          echo "fork     = ${CUR_SHA}"
          if [ "$UP_SHA" = "$CUR_SHA" ]; then
            echo "结论：完全一致，无需改动"
            exit 0
          fi

          # 关键：不要把分支指向上游的提交。
          # 只要本次 push 的提交范围里出现「改动 .github/workflows/ 的提交」，
          # GitHub 就会用 GITHUB_TOKEN 整条拒绝（refusing to allow a GitHub App
          # to create or update workflow ... without `workflows` permission）。
          # 上游主线会持续改自己的 workflow，所以对齐上游 SHA 的做法必然复发。
          #
          # 做法：以本仓库主线为基线，把上游的文件树整体覆盖进工作区与索引，
          # 再把 .github/workflows/ 恢复成本仓库自己的版本。
          # 这样只有一个新提交，且它对 workflow 目录零改动。
          git checkout -B "${SYNC_BRANCH}" "$CUR_SHA"
          git read-tree -u --reset "$UP_SHA"

          rm -rf "$OWN_WORKFLOW_DIR"
          git checkout "$CUR_SHA" -- "$OWN_WORKFLOW_DIR"

          git add -A
          if git diff --cached --quiet; then
            echo "结论：除 workflow 外无内容差异，无需推送"
            exit 0
          fi
          git commit -m "chore: sync upstream ${UP_SHA:0:12} [skip ci]"
          git push --force origin "${SYNC_BRANCH}"
          echo "结论：已同步到上游 ${UP_SHA}（${OWN_WORKFLOW_DIR} 保持本仓库版本）"

      - name: Mirror tags
        if: steps.fetch.outputs.ok == 'true'
        run: |
          set -euo pipefail
          # 逐个推送 tag。整体 `git push --tags` 有一个坏 tag 会连带整条失败：
          # 某些上游 tag 指向「改过 .github/workflows/」的提交，推送它的对象同样被
          # GITHUB_TOKEN 的 workflows 限制拒绝，而这类 tag 我们本来也无法镜像。
          # 所以逐个推，只跳过被拒的那几个，其余照常同步。
          skipped=0
          pushed=0
          for t in $(git tag --list); do
            if git push --force origin "refs/tags/${t}" >/dev/null 2>&1; then
              pushed=$((pushed+1))
            else
              skipped=$((skipped+1))
              echo "::warning::tag ${t} 跳过（指向含 workflow 变更的提交，token 无权推送）"
            fi
          done
          echo "tag 已推送 ${pushed} 个，跳过 ${skipped} 个，本地总数：$(git tag --list | wc -l)"

      - name: Warn when upstream is gone
        if: steps.fetch.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="上游仓库不可访问：${UPSTREAM_REPO}"
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "已有未关闭的同名 issue，跳过重复告警"
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --body "自动同步在 $(date -u +%Y-%m-%dT%H:%M:%SZ) 拉取上游失败。可能原因：上游被删除、转为私有，或改名。当前 fork 保留最后一次成功同步的完整快照，仍可正常使用。"
          echo "::error::上游不可访问，已在本仓库开 issue 告警"
          exit 1
